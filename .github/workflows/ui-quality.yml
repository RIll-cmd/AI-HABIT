name: UI Quality & Impeccable Detection

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ui-detect:
    name: Run Impeccable Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Impeccable Anti-Pattern Detection
        run: node .agents/skills/impeccable/scripts/detect.mjs client/src/
